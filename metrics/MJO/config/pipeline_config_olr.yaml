# OLR-based (standard RMM) run for FuXi; derived from pipeline_config.yaml (variable: olr).
variable: olr
resolution: 1.0
regrid_forecast: false
obs:
  era5_vp200_dir: /glade/campaign/univ/uchi0014/yqsun/pangu_s2s/newdata/velocity_potential_200
  era5_h5_dir: /glade/campaign/univ/uchi0014/yqsun/v2.1_fixed/DATA3
